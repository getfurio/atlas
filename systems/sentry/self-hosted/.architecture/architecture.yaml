  - { from: nginx, to: web, type: serves, protocol: http, description: Everything else }
  - { from: relay, to: web, type: calls, protocol: http, description: 'Upstream: project configurations' }
  - { from: relay, to: kafka, type: publishes, protocol: kafka }
  - { from: relay, to: redis, type: reads_writes, protocol: redis }
  - { from: web, to: pgbouncer, type: reads_writes, protocol: postgres }
  - { from: web, to: redis, type: reads_writes, protocol: redis }
  - { from: web, to: memcached, type: reads_writes, protocol: memcached }
  - { from: web, to: snuba-api, type: calls, protocol: http }
  - { from: web, to: seaweedfs, type: reads_writes, protocol: s3, description: Nodestore bucket }
  - { from: web, to: sentry-data, type: reads_writes, protocol: file }
  - { from: ingest-consumers, to: pgbouncer, type: reads_writes, protocol: postgres }
  - { from: ingest-consumers, to: redis, type: reads_writes, protocol: redis }
  - { from: ingest-consumers, to: memcached, type: reads_writes, protocol: memcached }
  - { from: ingest-consumers, to: snuba-api, type: calls, protocol: http }

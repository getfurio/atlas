  - { from: ingest-consumers, to: sentry-data, type: reads_writes, protocol: file }
  - { from: post-process-forwarders, to: pgbouncer, type: reads_writes, protocol: postgres }
  - { from: post-process-forwarders, to: redis, type: reads_writes, protocol: redis }
  - { from: post-process-forwarders, to: memcached, type: reads_writes, protocol: memcached }
  - { from: post-process-forwarders, to: snuba-api, type: calls, protocol: http }
  - { from: post-process-forwarders, to: seaweedfs, type: reads_writes, protocol: s3, description: Nodestore bucket }
  - { from: post-process-forwarders, to: sentry-data, type: reads_writes, protocol: file }
  - { from: taskscheduler, to: pgbouncer, type: reads_writes, protocol: postgres }
  - { from: taskscheduler, to: redis, type: reads_writes, protocol: redis }
  - { from: taskscheduler, to: memcached, type: reads_writes, protocol: memcached }
  - { from: taskscheduler, to: snuba-api, type: calls, protocol: http }
  - { from: taskscheduler, to: seaweedfs, type: reads_writes, protocol: s3, description: Nodestore bucket }
  - { from: taskscheduler, to: sentry-data, type: reads_writes, protocol: file }
  - { from: taskworker, to: pgbouncer, type: reads_writes, protocol: postgres }
  - { from: taskworker, to: redis, type: reads_writes, protocol: redis }
  - { from: taskworker, to: memcached, type: reads_writes, protocol: memcached }
  - { from: taskworker, to: snuba-api, type: calls, protocol: http }
  - { from: taskworker, to: seaweedfs, type: reads_writes, protocol: s3, description: Nodestore bucket }
  - { from: taskworker, to: sentry-data, type: reads_writes, protocol: file }

# Every manifest under systems/ is checked on every pull request: an error fails the check and
# shows up on the line that caused it.
name: Furio

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the manifests
        id: systems
        run: echo "paths=$(echo systems/*/*/ | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - uses: getfurio/furio@84ddf98b7cd8d70f1a56cb204d9baf8031b33532 # v0.6.3
        with:
          path: ${{ steps.systems.outputs.paths }}

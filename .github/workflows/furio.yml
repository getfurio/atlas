# Every manifest under systems/ is checked on every pull request: an error fails the check and
# shows up on the line that caused it.
name: Furio

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the manifests
        id: systems
        run: echo "paths=$(echo systems/*/*/ | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - uses: getfurio/furio@f46f0b9c9122e3b6eb7b7c5cbdce82970397563b # v0.6.0
        with:
          path: ${{ steps.systems.outputs.paths }}

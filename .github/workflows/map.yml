# Builds the maps from every manifest under systems/ and publishes them on GitHub Pages.
name: Map

on:
  push:
    branches: [main]
    paths: ['systems/**', '.github/workflows/map.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The Action builds a map from a GitHub organization; from folders of one repo, the CLI does.
      # One map with every system at the root, and one map per system in its own folder, so a
      # system can be looked at, and linked to, on its own.
      - name: Build the maps
        run: |
          furio="npx --yes @getfurio/cli@0.6.0"
          $furio build --workspace atlas --site --strict --out _site systems/*/*/
          for dir in systems/*/; do
            system=$(basename "$dir")
            $furio build --workspace "$system" --site --strict --out "_site/$system" "$dir"*/
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
